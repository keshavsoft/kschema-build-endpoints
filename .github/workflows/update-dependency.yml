name: Update dependency

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dep:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.git-push.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Update dependency
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package }}"
          if [ -n "$PACKAGE_NAME" ]; then
            echo "Updating package: $PACKAGE_NAME"
            npm install ${PACKAGE_NAME}@latest
          else
            echo "No package specified, updating both pull dependencies..."
            npm install kschema-pull-endpoints@latest kschema-pull-methods@latest
          fi

      - name: Commit, bump and publish
        id: git-push
        run: |
          # Check if there are changes
          if git diff --quiet package.json package-lock.json; then
            echo "No dependency changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump version patch
          npm version patch --no-git-tag-version
          
          # Publish to NPM using the helper script
          node npmPublish.js
          
          # Commit the changes
          git add package.json package-lock.json
          git commit -m "chore(deps): update ${{ github.event.client_payload.package || 'dependencies' }} and bump version [skip ci]"
          
          # Push directly to main
          git push origin HEAD:main
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    needs: update-dep
    if: needs.update-dep.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version")
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package=$NAME" >> $GITHUB_OUTPUT

      - name: Notify kschema-fs-api-gen-post-actions
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_PAT || secrets.DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Warning: DISPATCH_TOKEN secret is not set. Skipping notification."
            echo "### ⚠️ Notification Skipped" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason:** \`DISPATCH_TOKEN\` or \`REPO_DISPATCH_TOKEN\` secret is not set." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "Sending repository dispatch to keshavsoft/kschema-fs-api-gen-post-actions..."
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keshavsoft/kschema-fs-api-gen-post-actions/dispatches \
            -d "{\"event_type\": \"publish-success\", \"client_payload\": {\"package\": \"${{ steps.get_version.outputs.package }}\", \"version\": \"${{ steps.get_version.outputs.version }}\"}}")
          
          echo "HTTP Response Code: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -eq 204 ]; then
            echo "### ✅ Repository Dispatch Notification Sent Successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Repository:** [keshavsoft/kschema-fs-api-gen-post-actions](https://github.com/keshavsoft/kschema-fs-api-gen-post-actions)" >> $GITHUB_STEP_SUMMARY
            echo "- **Event Type:** \`publish-success\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Payload Package:** \`${{ steps.get_version.outputs.package }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Payload Version:** \`${{ steps.get_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **NPM Link:** [${{ steps.get_version.outputs.package }} on npm](https://www.npmjs.com/package/${{ steps.get_version.outputs.package }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Repository Dispatch Notification Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Repository:** [keshavsoft/kschema-fs-api-gen-post-actions](https://github.com/keshavsoft/kschema-fs-api-gen-post-actions)" >> $GITHUB_STEP_SUMMARY
            echo "- **HTTP Response Code:** $RESPONSE_CODE" >> $GITHUB_STEP_SUMMARY
            echo "- **NPM Link:** [${{ steps.get_version.outputs.package }} on npm](https://www.npmjs.com/package/${{ steps.get_version.outputs.package }})" >> $GITHUB_STEP_SUMMARY
            echo "Error: Notification failed with status $RESPONSE_CODE"
            exit 1
          fi

      - name: Notify vs-code-ext-from-any-js (in-between)
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_PAT || secrets.DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Warning: DISPATCH_TOKEN secret is not set. Skipping in-between notification."
            echo "### ⚠️ In-between Notification Skipped" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason:** \`DISPATCH_TOKEN\` or \`REPO_DISPATCH_TOKEN\` secret is not set." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "Sending repository dispatch to keshavsoft/vs-code-ext-from-any-js..."
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keshavsoft/vs-code-ext-from-any-js/dispatches \
            -d "{\"event_type\": \"dependency-updated\", \"client_payload\": {\"package\": \"${{ steps.get_version.outputs.package }}\", \"version\": \"${{ steps.get_version.outputs.version }}\"}}")
          
          echo "HTTP Response Code: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -eq 204 ]; then
            echo "### ✅ Repository Dispatch Notification Sent Successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Repository:** [keshavsoft/vs-code-ext-from-any-js](https://github.com/keshavsoft/vs-code-ext-from-any-js)" >> $GITHUB_STEP_SUMMARY
            echo "- **Event Type:** \`dependency-updated\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Payload Package:** \`${{ steps.get_version.outputs.package }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Payload Version:** \`${{ steps.get_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **NPM Link:** [${{ steps.get_version.outputs.package }} on npm](https://www.npmjs.com/package/${{ steps.get_version.outputs.package }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Repository Dispatch Notification Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Repository:** [keshavsoft/vs-code-ext-from-any-js](https://github.com/keshavsoft/vs-code-ext-from-any-js)" >> $GITHUB_STEP_SUMMARY
            echo "- **HTTP Response Code:** $RESPONSE_CODE" >> $GITHUB_STEP_SUMMARY
            echo "- **NPM Link:** [${{ steps.get_version.outputs.package }} on npm](https://www.npmjs.com/package/${{ steps.get_version.outputs.package }})" >> $GITHUB_STEP_SUMMARY
            echo "Error: Notification failed with status $RESPONSE_CODE"
            exit 1
          fi
